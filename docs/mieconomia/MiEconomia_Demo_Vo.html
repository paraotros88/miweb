n\x20comercio\x20que\x20ya\x20conoces\x20se\x20rellenan\x20los\x20campos\x20vacíos\x20con\x20lo\x20que\x20anotaste\x20la\x20última\x20vez.</li></ul></div>\x0a<div\x20class=\x22card\x22><p>En\x20<b>Inicio</b>\x20ves\x20el\x20mes\x20en\x20curso,\x20el\x20reparto\x20por\x20categoría\x20y\x20los\x20últimos\x20registros\x20(si\x20hay\x20varios\x20con\x20el\x20mismo\x20tipo,\x20categoría,\x20subcategoría,\x20concepto\x20e\x20importe,\x20sale\x20solo\x20el\x20más\x20reciente,\x20aunque\x20cambien\x20la\x20persona,\x20las\x20notas\x20o\x20las\x20etiquetas)\x20y\x20un\x20calendario\x20(el\x20icono\x20de\x20calendario\x20del\x20primer\x20marco\x20te\x20lleva\x20directo)\x20para\x20consultar\x20cualquier\x20día;\x20desde\x20ahí\x20puedes\x20editar,\x20duplicar\x20o\x20eliminar\x20(con\x20aviso\x20previo).\x20En\x20el\x20calendario,\x20el\x20punto\x20rojo\x20indica\x20que\x20existe\x20algún\x20gasto\x20ese\x20día\x20y\x20el\x20punto\x20negro,\x20algún\x20ingreso\x20(si\x20los\x20tienes\x20activados).</p><ul><li>«Ir\x20a:»\x20te\x20lleva\x20a\x20cualquier\x20fecha\x20y\x20el\x20botón\x20«Hoy»\x20vuelve\x20al\x20día\x20actual\x20(el\x20calendario\x20se\x20abre\x20con\x20hoy\x20seleccionado).\x20Los\x20movimientos\x20del\x20día\x20sacan\x20primero\x20los\x20generados\x20automáticamente\x20(fijos)\x20y\x20después\x20los\x20que\x20has\x20anotado,\x20por\x20orden\x20de\x20registro.</li><li>«Imprimir»\x20(junto\x20a\x20«Calendario»)\x20saca\x20el\x20resumen\x20del\x20mes\x20sin\x20los\x20últimos\x20registros\x20ni\x20el\x20calendario.</li><li>«Próximos\x20cargos»\x20lista\x20lo\x20que\x20queda\x20por\x20cobrar\x20hasta\x20final\x20de\x20mes\x20y\x20«Últimos\x20registros»\x20solo\x20muestra\x20lo\x20que\x20ya\x20ha\x20ocurrido.</li><li>Pulsa\x20<b>Editar</b>\x20en\x20un\x20registro\x20para\x20corregirlo;\x20en\x20esa\x20ventana,\x20«Eliminar»\x20lo\x20borra\x20(con\x20aviso\x20previo).</li><li>Los\x20iconos\x20de\x20cada\x20registro\x20son:\x20lápiz\x20(editar),\x20dos\x20hojas\x20con\x20un\x20«+»\x20(duplicar:\x20abre\x20una\x20ventana\x20donde\x20confirmas\x20o\x20cambias\x20el\x20importe\x20y\x20la\x20fecha,\x20que\x20por\x20defecto\x20es\x20hoy,\x20antes\x20de\x20crear\x20la\x20copia)\x20y\x20papelera\x20(eliminar,\x20con\x20aviso\x20previo).</li></ul></div>\x0a<div\x20class=\x22card\x22><p>En\x20<b>Fijos</b>\x20das\x20de\x20alta\x20lo\x20que\x20se\x20repite\x20(alquiler,\x20Netflix,\x20colegio…):\x20se\x20crea\x20solo\x20hasta\x20final\x20de\x20mes,\x20con\x20pausas\x20si\x20hace\x20falta.\x20Si\x20pones\x20una\x20fecha\x20de\x20fin,\x20pasa\x20solo\x20a\x20finalizado\x20cuando\x20se\x20supera;\x20«Cancelar»\x20lo\x20da\x20de\x20baja\x20desde\x20hoy.\x20«Imprimir»\x20saca\x20la\x20lista\x20y\x20los\x20próximos\x20gastos\x20creados.\x20En\x20«Posibles\x20gastos\x20fijos»\x20la\x20app\x20te\x20propone\x20convertir\x20en\x20fijo\x20lo\x20que\x20repites\x20cada\x20mes,\x20y\x20el\x20icono\x20de\x20gráfico\x20de\x20cada\x20fijo\x20abre\x20su\x20historial\x20de\x20importes.\x20Los\x20gastos\x20de\x20días\x20futuros\x20puedes\x20editarlos\x20o\x20borrarlos;\x20ya\x20cuentan\x20en\x20totales,\x20informes\x20y\x20presupuestos.</p></div>\x0a<div\x20class=\x22card\x22><p>En\x20<b>Informes</b>\x20ves\x20el\x20«Resumen»,\x20las\x20etiquetas\x20(toca\x20una\x20para\x20filtrar),\x20los\x20gráficos\x20de\x20gastos\x20por\x20categoría\x20y\x20por\x20subcategoría\x20y,\x20al\x20final,\x20la\x20proyección\x20del\x20año,\x20la\x20evolución\x20mensual\x20de\x20los\x20gastos\x20y\x20los\x20ingresos\x20agrupados\x20por\x20subcategoría\x20(la\x20subcategoría\x20y\x20la\x20proyección,\x20solo\x20en\x20modo\x20avanzado).\x20En\x20«Gastos\x20por\x20categoría»,\x20cada\x20línea\x20muestra\x20▲\x20o\x20▼\x20frente\x20al\x20mismo\x20tramo\x20del\x20periodo\x20anterior\x20(el\x20mes\x20en\x20curso,\x20contra\x20el\x20mismo\x20día\x20del\x20mes\x20pasado).\x20«Imprimir»\x20(el\x20último\x20de\x20los\x20tres\x20botones)\x20saca\x20el\x20informe\x20sin\x20el\x20marco\x20de\x20etiquetas.\x20Con\x20«Registrar\x20ingresos»\x20activado,\x20justo\x20debajo\x20del\x20primer\x20marco\x20hay\x20tres\x20pestañas\x20(Total,\x20Gastos\x20e\x20Ingresos):\x20«Gastos»\x20e\x20«Ingresos»\x20separan\x20por\x20completo\x20ambos\x20tipos\x20de\x20movimiento,\x20sin\x20mezclar\x20nada\x20(en\x20«Ingresos»\x20no\x20salen\x20los\x20marcos\x20de\x20gastos\x20y\x20en\x20«Gastos»\x20no\x20sale\x20el\x20marco\x20«Ingresos»).</p></div>\x0a<div\x20class=\x22card\x22><ul><li>En\x20<b>Inicio</b>,\x20el\x20marco\x20<b>Presupuestos</b>\x20(opcional)\x20muestra\x20barras\x20que\x20pasan\x20a\x20ámbar\x20y\x20a\x20rojo\x20(si\x20incluyen\x20gastos\x20de\x20días\x20futuros\x20ya\x20registrados,\x20una\x20nota\x20bajo\x20la\x20barra\x20lo\x20indica);\x20«Gestionar»\x20te\x20deja\x20poner\x20importes\x20por\x20categoría\x20y\x20por\x20etiqueta\x20(cada\x20tipo\x20en\x20su\x20marco),\x20el\x20interruptor\x20de\x20la\x20cabecera\x20del\x20marco\x20los\x20activa\x20o\x20desactiva\x20sin\x20borrar\x20los\x20importes\x20(desactivados\x20no\x20se\x20muestran\x20ni\x20dan\x20avisos\x20y\x20«Gestionar»\x20se\x20oculta;\x20si\x20usas\x20«Usar\x20como\x20presupuesto»\x20en\x20Simular,\x20se\x20activan\x20solos),\x20y\x20en\x20«Gestionar»\x20el\x20botón\x20«Reiniciar»\x20vacía\x20los\x20importes\x20del\x20formulario\x20hasta\x20que\x20pulses\x20«Guardar»\x20(con\x20«Cancelar»\x20conservas\x20los\x20que\x20tenías),\x20y\x20los\x20avisos\x20salen\x20dentro\x20de\x20la\x20app.</li></ul></div>\x0a<div\x20class=\x22card\x22><p>En\x20<b>Simular</b>\x20(solo\x20en\x20modo\x20avanzado)\x20pruebas\x20cuánto\x20ahorrarías:\x20reduce\x20categorías\x20con\x20las\x20barras,\x20fija\x20un\x20objetivo\x20mensual\x20o\x20quita\x20un\x20gasto\x20fijo,\x20y\x20guarda\x20cada\x20plan\x20como\x20escenario.\x20«Imprimir»\x20saca\x20el\x20resumen\x20y\x20las\x20barras\x20de\x20reducción.\x20El\x20ahorro\x20mensual\x20que\x20escribes\x20se\x20mantiene\x20al\x20pulsar\x20«Repartir»\x20(solo\x20se\x20borra
