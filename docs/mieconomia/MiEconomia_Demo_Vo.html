ca\x20el\x20resumen\x20y\x20las\x20barras\x20de\x20reducción.\x20El\x20ahorro\x20mensual\x20que\x20escribes\x20se\x20mantiene\x20al\x20pulsar\x20«Repartir»\x20(solo\x20se\x20borra\x20al\x20cargar\x20un\x20escenario\x20o\x20al\x20reiniciar).</li><li>Los\x20gastos\x20e\x20ingresos\x20con\x20fecha\x20futura\x20(por\x20ejemplo,\x20los\x20fijos\x20que\x20quedan\x20del\x20mes)\x20ya\x20cuentan\x20en\x20los\x20totales,\x20gráficos\x20e\x20informes,\x20para\x20que\x20veas\x20lo\x20que\x20va\x20a\x20venir;\x20si\x20los\x20eliminas\x20o\x20cancelas,\x20todo\x20se\x20recalcula.</li><li>El\x20botón\x20verde\x20<b>UP</b>\x20aparece\x20junto\x20al\x20menú\x20(debajo\x20si\x20está\x20a\x20la\x20izquierda,\x20encima\x20si\x20está\x20abajo)\x20cuando\x20has\x20bajado\x20en\x20una\x20página,\x20y\x20te\x20devuelve\x20arriba.</li><li>Todas\x20las\x20impresiones\x20llevan\x20al\x20pie\x20«Página\x20X\x20de\x20Y»\x20y\x20«MiEconomia\x20·\x20©\x202026\x20CristianFG»\x20(en\x20Chrome\x20y\x20Edge\x20actuales;\x20otros\x20navegadores\x20pueden\x20no\x20mostrarlo).</li><li>Los\x20importes\x20se\x20muestran\x20siempre\x20en\x20euros,\x20con\x20punto\x20para\x20los\x20miles\x20y\x20coma\x20para\x20los\x20decimales\x20(1.234,56€,\x20con\x20el\x20símbolo\x20pegado\x20al\x20número);\x20al\x20escribirlos\x20puedes\x20usar\x20coma\x20o\x20punto.</li><li>En\x20<b>Administración</b>\x20configuras\x20la\x20app,\x20las\x20categorías\x20y\x20las\x20copias\x20de\x20seguridad.</li></ul></div>\x0a<div\x20class=\x22card\x22><h3>Documento\x20detallado</h3>\x0a<details><summary>Categorías\x20y\x20marcas</summary><p>Cada\x20categoría\x20puede\x20ser\x20Esencial,\x20Flexible\x20o\x20Prescindible.\x20Sirve\x20para\x20las\x20simulaciones\x20de\x20ahorro\x20y\x20para\x20los\x20colores\x20de\x20las\x20barras.\x20Puedes\x20crear,\x20desactivar\x20o\x20eliminar\x20categorías;\x20si\x20tienen\x20registros,\x20solo\x20se\x20pueden\x20desactivar.</p></details>\x0a<details><summary>Gastos\x20fijos\x20y\x20periódicos</summary><p>Indica\x20importe,\x20periodicidad\x20(semanal\x20a\x20anual)\x20y\x20primera\x20fecha;\x20se\x20generan\x20solos\x20hasta\x20final\x20de\x20mes.\x20La\x20app\x20lo\x20comprueba\x20al\x20abrirla\x20o\x20volver\x20a\x20ella\x20y\x20solo\x20trabaja\x20si\x20ha\x20cambiado\x20el\x20día\x20desde\x20la\x20última\x20vez,\x20o\x20si\x20creas\x20o\x20editas\x20un\x20fijo;\x20no\x20funciona\x20en\x20segundo\x20plano\x20con\x20la\x20app\x20cerrada,\x20así\x20que\x20al\x20abrirla\x20se\x20pone\x20al\x20día.\x20Los\x20gastos\x20de\x20días\x20futuros\x20(pestaña\x20Fijos,\x20«Próximos\x20gastos\x20ya\x20creados»)\x20puedes\x20editarlos\x20o\x20borrarlos:\x20ya\x20cuentan\x20en\x20totales,\x20informes\x20y\x20presupuestos\x20(las\x20barras\x20de\x20presupuesto\x20indican\x20cuánto\x20incluyen\x20de\x20gastos\x20futuros).\x20Si\x20borras\x20uno\x20no\x20se\x20vuelve\x20a\x20crear,\x20y\x20si\x20cambias\x20un\x20fijo\x20se\x20rehacen\x20los\x20futuros\x20que\x20no\x20hayas\x20editado\x20a\x20mano.\x20Si\x20el\x20día\x20no\x20existe\x20en\x20un\x20mes\x20(29,\x2030\x20o\x2031)\x20se\x20usa\x20el\x20último\x20día.\x20Puedes\x20pausar\x20meses\x20enteros\x20cada\x20año\x20(julio\x20y\x20agosto\x20del\x20colegio)\x20y\x20rangos\x20de\x20fechas.\x20Marca\x20«importe\x20variable»\x20para\x20que\x20se\x20creen\x20como\x20«estimado»\x20y\x20ajústalos\x20después\x20en\x20«Pendientes\x20de\x20ajustar».\x20Con\x20la\x20«Fecha\x20de\x20fin»\x20(opcional)\x20el\x20gasto\x20fijo\x20pasa\x20solo\x20a\x20«finalizado»\x20(en\x20verde)\x20cuando\x20esa\x20fecha\x20ya\x20ha\x20pasado,\x20sin\x20tocar\x20ningún\x20botón.\x20Si\x20se\x20la\x20pones\x20editándolo\x20(aunque\x20sea\x20una\x20fecha\x20pasada)\x20y\x20hay\x20movimientos\x20posteriores,\x20la\x20app\x20te\x20avisa\x20de\x20cuántos\x20se\x20van\x20a\x20eliminar\x20y\x20te\x20pide\x20confirmar\x20pulsando\x20«Guardar»\x20otra\x20vez.\x20Si\x20quitas\x20la\x20fecha\x20de\x20fin\x20a\x20uno\x20finalizado,\x20vuelve\x20a\x20estar\x20activo\x20y\x20se\x20genera\x20desde\x20hoy\x20(los\x20meses\x20que\x20quedaron\x20sin\x20generar\x20no\x20se\x20recuperan).\x20«Cancelar»\x20da\x20de\x20baja\x20el\x20gasto\x20desde\x20hoy:\x20detiene\x20la\x20generación\x20y\x20borra\x20los\x20gastos\x20futuros\x20ya\x20creados\x20(queda\x20marcado\x20en\x20rojo).\x20«Imprimir»\x20(arriba\x20a\x20la\x20derecha)\x20saca\x20la\x20lista\x20de\x20gastos\x20fijos\x20y\x20los\x20próximos\x20gastos\x20ya\x20creados,\x20sin\x20los\x20pendientes\x20de\x20ajustar.\x20Con\x20«Mostrar\x20finalizados\x20y\x20cancelados»,\x20los\x20finalizados\x20(en\x20verde)\x20y\x20los\x20cancelados\x20(en\x20rojo)\x20aparecen\x20en\x20un\x20recuadro\x20aparte.\x20En\x20pantallas\x20pequeñas,\x20los\x20botones\x20de\x20cada\x20gasto\x20pasan\x20a\x20una\x20segunda\x20línea,\x20alineados\x20a\x20la\x20derecha.\x20Los\x20estimados\x20aparecen\x20en\x20«Pendientes\x20de\x20ajustar»\x20cuando\x20llega\x20su\x20fecha.\x20«Generar\x20hasta\x20fin\x20de\x20año»\x20crea\x20por\x20adelantado\x20los\x20que\x20faltan.\x20Los\x20gastos\x20sin\x20periodicidad\x20(ropa)\x20se\x20añaden\x20con\x20«Añadir».</p></details>\x0a<details><summary>Informes</summary><p>La\x20«Subcategoría»\x20afina\x20dentro\x20de\x20la\x20categoría\x20(por\x20ejemplo,\x20Regalos\x20›\x20Familia):\x20sale\x20en\x20los\x20registros\x20y\x20el\x20CSV,\x20y\x20el\x20informe\x20«Por\x20subcategoría»\x20suma\x20por\x20ella.\x20Las\x20etiquetas\x20muestran\x20por\x20defecto\x20las\x20del\x20último\x20año;\x20el\x20interruptor\x20«Histórico»\x20las\x20muestra\x20todas.\x20Puedes\x20marcar\x20una\x20o\x20varias\x20(el\x20informe\x20muestra\x20los\x20movimientos\x20que\x20lleven\x20cualquiera\x20de\x20ellas,\x20no\x20todas\x20a\x20la\x20vez;\x20al\x20marcar\x20o\x20desmarcar,\x20la\x20pantalla\x20se\x20queda\x20en\x20el\x20marco\x20de\x20Etiquetas)\x20y\x20usar\x20«Marcar\x20todas»\x20y\x20«Desmarcar\x20todas».\x20Elige\x20periodo\x20(este\x20mes,\x20mes\x20anterior,\x20últimos\x203\x20o\x2012\x20meses,\x20año\x20actual,\x20año\x20anterior\x20o\x20histórico\x20(todo);\x20los\x20«últimos»\x20incluyen\x20el\x20mes\x20en\x20curso)\x20y\x20persona.\x20«Exportar»\x20y\x20«Movimientos»\x20se\x20desactivan\x20si\x20no\x20hay\x20registros\x20en\x20el\x20periodo.\x20Verás\x20el\x20total,\x20el\x20reparto\x20por\x20categoría,\x20el\x20peso\x20de\x20lo\x20Esencial,\x20Flexible\x20y\x20Prescindible\x20(lo\x20recortable),\x20la\x20evolución\x20de\x2012\x20meses,\x20los\x20mayores\x20gastos\x20(por\x20comercio\x20o\x20concepto)\x20y\x20las\x20etiquetas\x20(toca\x20una\x20para\x20filtrar).\x20«Imprimir»\x20(el\x20último\x20de\x20los\x20tres\x20botones)\x20saca\x20el\x20informe\x20sin\x20el\x20marco\x20de\x20etiquetas,\x20«Exportar»\x20descarga\x20los\x20datos\x20en\x20CSV\x20y\x20«Movimientos»\x20abre\x20la\x20lista\x20completa\x20de\x20los\x20movimientos\x20que\x20cuentan\x20en\x20ese\x20informe\x20(por\x20ejemplo,\x20los\x20de\x20una\x20etiqueta),\x20con\x20opción\x20de\x20imprimirla;\x20cada\x20movimiento\x20tiene\x20un\x20lápiz\x20para\x20editarlo\x20y\x20una\x20papelera\x20para\x20eliminarlo\x20(con\x20aviso\x20previo)\x20y,\x20al\x20terminar,\x20vuelves\x20a\x20la\x20lista\x20(también\x20hay\x20una\x20X\x20arriba\x20para\x20cerrarla).\x20El\x20balance\x20sale\x20en\x20verde\x20si\x20es\x200\x20o\x20positivo\x20y\x20en\x20rojo\x20si\x20es\x20negativo.\x20«No\x20fijos\x20estimados»\x20en\x20la\x20proyección\x20son\x20los\x20gastos\x20que\x20no\x20se\x20repiten\x20solos\x20(compra,\x20ropa,\x20ocio…).\x20La\x20tarjeta\x20«Proyección»\x20estima\x20cómo\x20cerrará\x20el\x20año\x20si\x20todo\x20sigue\x20igual:\x20lo\x20gastado\x20hasta\x20hoy,\x20más\x20los\x20fijos\x20que\x20faltan\x20(con\x20sus\x20pausas)\x20y\x20el\x20gasto\x20suelto,\x20calculado\x20con\x20la\x20mediana\x20de\x20los\x20últimos\x20meses\x20completos,\x20hasta\x206,\x20que\x20no\x20se\x20deja\x20influir\x20por\x20un\x20mes\x20con\x20una\x20compra\x20grande\x20(o\x20con\x20el\x20ritmo\x20de\x20este\x20mes\x20si\x20aún\x20no\x20los\x20hay).\x20No\x20guarda\x20nada\x20y\x20respeta\x20el\x20filtro\x20de\x20persona.</p></details>\x0a<details><summary>Presupuestos\x20y\x20avisos</summary><p>Los\x20presupuestos\x20son\x20opcionales.\x20En\x20«Gestionar»\x20pones\x20un\x20importe\x20y\x20un\x20periodo\x20(semanal,\x20mensual,\x20trimestral,\x20semestral\x20o\x20anual)\x20a\x20cada\x20categoría;\x20si\x20lo\x20dejas\x20vacío,\x20esa\x20categoría\x20no\x20se\x20controla.\x20Los\x20periodos\x20son\x20los\x20naturales\x20(la\x20semana\x20empieza\x20en\x20lunes).\x20A\x20las\x20etiquetas\x20les\x20pones\x20un\x20importe\x20único:\x20acumula\x20todos\x20los\x20gastos\x20que\x20lleven\x20esa\x20etiqueta,\x20sin\x20fechas.\x20Cuentan\x20todos\x20los\x20gastos\x20registrados,\x20también\x20los\x20de\x20fecha\x20futura.</p><p>La\x20barra\x20va\x20en\x20verde,\x20pasa\x20a\x20ámbar\x20y\x20a\x20rojo\x20según\x20los\x20porcentajes\x20de\x20Administración\x20(por\x20defecto\x2075\x20%\x20y\x20100\x20%).\x20Con\x20los\x20avisos\x20activados,\x20Inicio\x20muestra\x20un\x20marco\x20de\x20avisos\x20y,\x20al\x20guardar\x20un\x20gasto,\x20el\x20mensaje\x20te\x20dice\x20si\x20esa\x20categoría\x20o\x20etiqueta\x20va\x20por\x20encima\x20del\x20umbral.\x20Las\x20notificaciones\x20con\x20la\x20aplicación\x20cerrada\x20no\x20existen,\x20porque\x20no\x20hay\x20servidor.</p><p>En\x20Simular,\x20el\x20botón\x20«Presupuesto»\x20de\x20un\x20escenario\x20crea\x20presupuestos\x20mensuales\x20con\x20sus\x20importes\x20(gasto\x20actual\x20menos\x20recorte),\x20previa\x20confirmación\x20y\x20con\x20«Deshacer».</p></details>\x0a<details><summary>Simulaciones\x20y\x20escenarios</summary><p>Parten\x20de\x20tu\x20gasto\x20medio\x20mensual\x20de\x20los\x20últimos\x203\x20meses\x20completos\x20y\x20nunca\x20modifican\x20tus\x20datos\x20reales.\x20Mueve\x20la\x20barra\x20de\x20cada\x20categoría\x20para\x20ver\x20cuánto\x20ahorrarías\x20al\x20mes\x20y\x20al\x20año;\x20las\x20categorías\x20Esenciales\x20aparecen\x20bloqueadas\x20con\x20un\x20candado.\x20«Objetivo\x20de\x20ahorro»\x20reparte\x20el\x20recorte\x20que\x20escribas\x20solo\x20entre\x20lo\x20Flexible\x20y\x20Prescindible,\x20en\x20proporción\x20a\x20lo\x20que\x20gastas\x20en\x20cada\x20cosa;\x20lo\x20Prescindible\x20recorta\x20el\x20doble\x20de\x20porcentaje\x20que\x20lo\x20Flexible\x20(es\x20una\x20calculadora\x20de\x20reparto,\x20no\x20una\x20recomendación).\x20También\x20puedes\x20quitar\x20un\x20gasto\x20fijo\x20(por\x20ejemplo,\x20Netflix)\x20poniéndolo\x20en\x20OFF;\x20los\x20que\x20están\x20en\x20ON\x20cuentan\x20como\x20hasta\x20ahora.\x20Al\x20quitar\x20un\x20gasto\x20fijo,\x20el\x20porcentaje\x20y\x20la\x20barra\x20de\x20su\x20categoría\x20(también\x20las\x20bloqueadas)\x20se\x20recalculan,\x20y\x20la\x20barra\x20se\x20rellena\x20en\x20verde\x20y\x20su\x20parte\x20más\x20oscura\x20es\x20lo\x20que\x20ya\x20recorta\x20ese\x20gasto:\x20la\x20bolita\x20queda\x20al\x20final\x20de\x20esa\x20parte\x20y\x20no\x20puede\x20bajar\x20de\x20ahí.\x20«Guardar\x20escenario»\x20conserva\x20el\x20plan\x20con\x20su\x20nombre;\x20«Cargar»\x20lo\x20recupera\x20para\x20seguir\x20ajustándolo.\x20Si\x20guardas\x20con\x20un\x20nombre\x20ya\x20existente,\x20se\x20actualiza.\x20«Usar\x20como\x20presupuesto»\x20convierte\x20el\x20escenario\x20en\x20presupuestos\x20mensuales\x20por\x20categoría\x20(pide\x20confirmación\x20y\x20se\x20puede\x20deshacer).</p></details>\x0a<details><summary>Etiquetas</summary><p>Una\x20etiqueta\x20agrupa\x20gastos\x20de\x20distintas\x20categorías,\x20sin\x20importar\x20la\x20fecha.\x20Conviene\x20incluir\x20el\x20año\x20(por\x20ejemplo\x20#Navidad2026)\x20para\x20no\x20mezclar\x20ediciones.</p></details>\x0a<details><summary>Ingresos</summary><p>Están\x20desactivados\x20por\x20defecto.\x20Actívalos\x20en\x20Administración\x20para\x20ver\x20el\x20selector\x20Gasto/Ingreso\x20al\x20añadir.\x20Si\x20los\x20desactivas\x20después,\x20se\x20ocultan\x20en\x20toda\x20la\x20app\x20(calendario,\x20Fijos,\x20informes)\x20y\x20no\x20entran\x20en\x20ningún\x20cálculo,\x20pero\x20no\x20se\x20borran:\x20reaparecen\x20al\x20volver\x20a\x20activarlos.</p></details>\x0a<details><summary>Datos,\x20copias\x20y\x20Deshacer</summary><p>Los\x20datos\x20se\x20guardan\x20solo\x20en\x20este\x20navegador\x20(IndexedDB).\x20Exporta\x20una\x20copia\x20con\x20regularidad:\x20se\x20descarga\x20como\x20MiEconomia_aaaammdd.json.\x20Tras\x20eliminar,\x20repetir\x20o\x20importar,\x20tienes\x205\x20segundos\x20para\x20pulsar\x20«Deshacer».\x20El\x20botón\x20«Eliminar\x20datos\x20locales»\x20(junto\x20a\x20Exportar\x20e\x20Importar)\x20borra\x20de\x20este\x20navegador\x20todos\x20los\x20datos\x20de\x20la\x20aplicación\x20y\x20no\x20se\x20puede\x20deshacer:\x20exporta\x20antes\x20una\x20copia\x20si\x20quieres\x20conservarlos.</p></details>\x0a<details><summary>Acerca\x20de</summary><p>MiEconomía\x20·\x20©\x202026\x20CristianFG\x20·\x20Todos\x20los\x20derechos\x20reservados.\x20La\x20versión\x20aparece\x20al\x20pie\x20de\x20esta\x20pestaña.\x20Las\x20impresiones\x20llevan\x20abajo\x20«Página\x20X\x20de\x20Y»\x20y\x20«MiEconomia\x20·\x20©\x202026\x20CristianFG»\x20(en\x20Chrome\x20y\x20Edge\x20actuales;\x20otros\x20navegadores\x20pueden\x20no\x20mostrarlo).</p></details></div>',GLYPH=_0x46b957(0xd3,0x130);function _0x46b957(_0x5aae9f,_0x4665dc){return _0x4b7b(_0x4665dc- -0x314,_0x5aae9f);}const svgIcon=_0x39d940=>'<svg\x20xmlns=\x22http://www.w3.org/2000/svg\x22\x20viewBox=\x220\x200\x2024\x2024\x22>'+(_0x39d940?_0x599341(0xeb,0x1d5)+GLYPH+'</g>':GLYPH)+'</svg>';if(DEMO){document[_0x599341(-0xdb,-0x182)]=_0x46b957(-0xbc,0x1ac);const h1=document[_0x46b957(0x138,0x2a2)]('h1');if(h1)h1[_0x599341(-0x15c,-0xd3)]='MiEconomía\x20-\x20DEMO';}try{const ic=svgIcon(!![]),mf={'name':DEMO?_0x599341(0x1fc,-0x15):_0x46b957(0x10b,-0xc5),'short_name':DEMO?_0x46b957(-0x255,-0x56):_0x46b957(-0x2f6,-0xc5),'display':_0x46b957(0xac,0xfc),'background_color':_0x46b957(0x156,0x204),'theme_color':_0x46b957(-0x93,0x64),'icons'
